name: Manual integration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksum-install-setup:
    name: Real checksum install and setup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify managed gws checksum install without Google auth
        run: |
          state="$(mktemp -d)"
          node dist/cli.js install --state "$state" --json
          node dist/cli.js doctor --state "$state" --json
      - name: Verify setup dry-run and isolated local deployment
        run: |
          target="$(mktemp -d)"
          state="$(mktemp -d)"
          node dist/cli.js setup --agent hermes --target "$target" --state "$state" --dry-run --json
          node dist/cli.js setup --agent hermes --target "$target" --state "$state" --json
